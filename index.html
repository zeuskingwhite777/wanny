<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💖 voce vai ser minha pra sempre??? 💖</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="30" viewBox="0 0 24 30"><text font-family="Arial" font-size="24" y="24">💕</text></svg>') 12 0, auto;
        }

        body {
            background: #0a0014;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            overflow: hidden;
            position: relative;
        }

        /* ─── ESTRELAS ─── */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .star {
            position: absolute;
            color: #fff;
            font-size: 14px;
            animation: twinkle 1.8s ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* ─── CONTAINER ─── */
        .container {
            position: relative;
            z-index: 1;
            background: rgba(20, 0, 40, 0.8);
            border: 3px solid #ff66b2;
            border-radius: 40px 10px 40px 10px;
            padding: 45px 40px 40px;
            max-width: 700px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 102, 178, 0.3), inset 0 0 30px rgba(255, 102, 178, 0.1);
            backdrop-filter: blur(4px);
        }

        /* ─── TÍTULO ─── */
        .title {
            font-size: 22px;
            color: #ffb3d9;
            text-shadow: 0 0 20px #ff66b2, 0 0 40px #ff3399;
            margin-bottom: 20px;
            line-height: 1.6;
            letter-spacing: 2px;
            word-break: break-word;
        }

        .title span {
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* ─── GIF / EMOJI CENTRAL ─── */
        .emoji-big {
            font-size: 90px;
            display: block;
            margin: 10px 0 20px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        /* ─── BOTÕES ─── */
        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin-top: 25px;
            flex-wrap: wrap;
            position: relative;
        }

        .btn {
            font-family: 'Press Start 2P', 'Courier New', monospace;
            font-size: 20px;
            padding: 16px 40px;
            border: 3px solid #ff66b2;
            border-radius: 60px 15px 60px 15px;
            background: rgba(255, 102, 178, 0.15);
            color: #ffb3d9;
            text-shadow: 0 0 15px #ff66b2;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 102, 178, 0.2);
            backdrop-filter: blur(2px);
            min-width: 140px;
            letter-spacing: 1px;
            position: relative;
        }

        .btn:hover {
            background: rgba(255, 102, 178, 0.3);
            box-shadow: 0 0 40px rgba(255, 102, 178, 0.5);
            transform: scale(1.05);
        }

        .btn-sim {
            border-color: #ff3399;
            color: #ff80bf;
            background: rgba(255, 51, 153, 0.2);
            box-shadow: 0 0 30px rgba(255, 51, 153, 0.3);
        }

        .btn-sim:hover {
            background: rgba(255, 51, 153, 0.4);
            box-shadow: 0 0 60px rgba(255, 51, 153, 0.6);
            transform: scale(1.1);
        }

        .btn-nao {
            border-color: #666;
            color: #999;
            background: rgba(100, 100, 100, 0.1);
            box-shadow: none;
            transition: all 0.05s ease;
            position: relative;
            cursor: pointer;
        }

        .btn-nao:hover {
            transform: scale(1);
        }

        /* ─── MENSAGEM FINAL ─── */
        .final-message {
            display: none;
            margin-top: 30px;
            padding: 20px;
            font-size: 28px;
            color: #ffb3d9;
            text-shadow: 0 0 30px #ff3399, 0 0 60px #ff66b2;
            line-height: 2;
            animation: fadeIn 1.2s ease;
            border-top: 2px solid #ff66b2;
            padding-top: 25px;
        }

        .final-message .big-emoji {
            font-size: 70px;
            display: block;
            margin-bottom: 10px;
            animation: pulse 2.2s ease-in-out infinite;
        }

        .final-message .heart-rain {
            font-size: 30px;
            letter-spacing: 10px;
            display: block;
            margin-top: 10px;
            animation: float 2s ease-in-out infinite;
        }

        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ─── CORAÇÕES FLUTUANTES ─── */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 28px;
            animation: floatUp 6s linear forwards;
            opacity: 0.9;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.3);
                opacity: 0;
            }
        }

        /* ─── RESPONSIVO ─── */
        @media (max-width: 600px) {
            .container {
                padding: 25px 18px 30px;
            }
            .title {
                font-size: 15px;
            }
            .btn {
                font-size: 14px;
                padding: 14px 24px;
                min-width: 100px;
            }
            .buttons {
                gap: 20px;
            }
            .emoji-big {
                font-size: 60px;
            }
            .final-message {
                font-size: 20px;
            }
            .final-message .big-emoji {
                font-size: 50px;
            }
        }

        @media (max-width: 400px) {
            .title {
                font-size: 12px;
            }
            .btn {
                font-size: 11px;
                padding: 12px 16px;
                min-width: 70px;
            }
        }
    </style>
</head>
<body>

    <!-- ESTRELAS -->
    <div class="stars" id="stars"></div>

    <!-- CORAÇÕES FLUTUANTES -->
    <div class="floating-hearts" id="floatingHearts"></div>

    <!-- CONTEÚDO PRINCIPAL -->
    <div class="container" id="container">

        <div class="emoji-big">💕</div>

        <div class="title">
            <span>💖</span> voce vai ser minha pra sempre??? <span>💖</span>
        </div>

        <div class="buttons" id="buttonArea">
            <button class="btn btn-sim" id="btnSim">💗 SIM</button>
            <button class="btn btn-nao" id="btnNao">💔 NÃO</button>
        </div>

        <div class="final-message" id="finalMessage">
            <span class="big-emoji">🥺💕</span>
            foi oq eu pensei :) <br>
            <span style="font-size:48px; display:block; margin:10px 0;">💖 TE AMO 💖</span>
            <span class="heart-rain">💗 💖 💕 💘 💝 💗 💖 💕</span>
        </div>

    </div>

    <script>
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 1. ESTRELAS
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const starsContainer = document.getElementById('stars');
        const emojisEstrela = ['✦', '✧', '⭐', '🌟', '✨', '💫'];
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('span');
            star.className = 'star';
            star.textContent = emojisEstrela[Math.floor(Math.random() * emojisEstrela.length)];
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.fontSize = (Math.random() * 20 + 10) + 'px';
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.animationDuration = (Math.random() * 3 + 1.5) + 's';
            starsContainer.appendChild(star);
        }

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 2. BOTÃO "NÃO" FUGINDO
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        const btnNao = document.getElementById('btnNao');
        const btnSim = document.getElementById('btnSim');
        const finalMessage = document.getElementById('finalMessage');
        const container = document.getElementById('container');
        const buttonArea = document.getElementById('buttonArea');

        let tentativas = 0;

        btnNao.addEventListener('mouseenter', function(e) {
            // Se já clicou no SIM, não foge mais
            if (finalMessage.style.display === 'block') return;

            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();

            // Área segura dentro do container
            const padding = 20;
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;

            // Posição atual relativa ao container
            let currentX = btnNao.offsetLeft;
            let currentY = btnNao.offsetTop;

            let newX, newY;
            let attempts = 0;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
                // Evita loop infinito
                if (attempts > 50) break;
            } while (Math.abs(newX - currentX) < 30 && Math.abs(newY - currentY) < 30);

            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.max(0, Math.min(newX, maxX)) + 'px';
            btnNao.style.top = Math.max(0, Math.min(newY, maxY)) + 'px';

            tentativas++;
            if (tentativas > 3) {
                btnNao.textContent = '😭 paraaaa';
            }
            if (tentativas > 6) {
                btnNao.textContent = '💀 desiste';
            }
            if (tentativas > 10) {
                btnNao.textContent = '🥺🥺🥺';
            }
        });

        // Se mesmo assim clicar no NÃO (pra garantir)
        btnNao.addEventListener('click', function(e) {
            if (finalMessage.style.display === 'block') return;
            alert('🥺 não tem jeito... cê vai ter que clicar no SIM! 💕');
            // Move o botão de novo
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = containerRect.height - btnRect.height - 20;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 3. BOTÃO "SIM" - EXPLODE TUDO
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        btnSim.addEventListener('click', function() {
            // Esconde os botões
            buttonArea.style.display = 'none';

            // Mostra a mensagem final
            finalMessage.style.display = 'block';

            // Explode corações na tela
            for (let i = 0; i < 45; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'floating-heart';
                    const emojis = ['💗', '💖', '💕', '💘', '💝', '❤️', '🧡', '💛', '💚', '💙', '💜', '🤍', '🩷'];
                    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    heart.style.left = Math.random() * 90 + 5 + '%';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heart.style.animationDuration = (Math.random() * 4 + 3) + 's';
                    heart.style.animationDelay = '0s';
                    document.getElementById('floatingHearts').appendChild(heart);

                    // Remove após a animação
                    setTimeout(() => {
                        heart.remove();
                    }, 7000);
                }, i * 80);
            }

            // Muda o título do site
            document.querySelector('.title').style.display = 'none';
            document.querySelector('.emoji-big').style.display = 'none';

            // Scroll suave pra mensagem
            setTimeout(() => {
                finalMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 500);
        });

        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        // 4. CORAÇÕES FLUTUANTES ALEATÓRIOS (de fundo)
        // ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
        setInterval(() => {
            if (finalMessage.style.display === 'block') return;
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            const emojis = ['💕', '💗', '💖', '✨'];
            heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.fontSize = (Math.random() * 18 + 14) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
            heart.style.opacity = '0.5';
            document.getElementById('floatingHearts').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }, 2000);
    </script>
</body>
</html>
